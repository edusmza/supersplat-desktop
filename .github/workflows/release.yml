name: Release

# Compila la app en Windows y publica un Release al subir una etiqueta v*
# (por ejemplo: git tag v3.7.0 && git push origin v3.7.0).
# También se puede lanzar a mano desde la pestaña Actions indicando la versión
# (por ejemplo v3.7.0): en ese caso el workflow crea la etiqueta y el Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de SuperSplat a publicar (ej. v3.7.0)'
        required: true
        default: 'v3.7.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar SuperSplat
        run: npm run build:editor
        env:
          SUPERSPLAT_REF: ${{ env.VERSION }}

      - name: Usar la versión en package.json
        shell: bash
        run: npm pkg set version="${VERSION#v}"

      - name: Empaquetar para Windows
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: SuperSplat-Windows
          path: release/*.exe

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SuperSplat Desktop ${{ env.VERSION }}
          files: release/*.exe
          body: |
            SuperSplat Desktop basado en [SuperSplat ${{ env.VERSION }}](https://github.com/playcanvas/supersplat/releases/tag/${{ env.VERSION }}) de PlayCanvas.

            ## Descargas
            - **SuperSplat-Setup-*.exe**: instalador con accesos directos, desinstalador y asociación de archivos (`.ply`, `.splat`, `.sog`, `.spz`, `.ksplat`, `.ssproj`).
            - **SuperSplat-Portable-*.exe**: un solo ejecutable que no requiere instalación.

            ## Requisitos
            - Windows 10/11 de 64 bits.
            - Placa de video con soporte de WebGPU y drivers actualizados.

            ## Notas
            - Los ejecutables no están firmados. Si aparece el aviso "Windows protegió su PC", hacé clic en **Más información → Ejecutar de todas formas**.
            - Atajos: **F11** pantalla completa, **F12** herramientas de desarrollo.
