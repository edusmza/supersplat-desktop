name: Release

# Compila la app en Windows y publica un Release al subir una etiqueta v*
# (por ejemplo: git tag v3.7.0 && git push origin v3.7.0).
# También se puede lanzar a mano desde la pestaña Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar SuperSplat
        run: npm run build:editor
        env:
          SUPERSPLAT_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Empaquetar para Windows
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: SuperSplat-Windows
          path: release/*.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SuperSplat Desktop ${{ github.ref_name }}
          files: release/*.exe
          body: |
            SuperSplat Desktop basado en [SuperSplat ${{ github.ref_name }}](https://github.com/playcanvas/supersplat/releases/tag/${{ github.ref_name }}) de PlayCanvas.

            ## Descargas
            - **SuperSplat-Setup-*.exe**: instalador con accesos directos, desinstalador y asociación de archivos (`.ply`, `.splat`, `.sog`, `.spz`, `.ksplat`, `.ssproj`).
            - **SuperSplat-Portable-*.exe**: un solo ejecutable que no requiere instalación.

            ## Requisitos
            - Windows 10/11 de 64 bits.
            - Placa de video con soporte de WebGPU y drivers actualizados.

            ## Notas
            - Los ejecutables no están firmados. Si aparece el aviso "Windows protegió su PC", hacé clic en **Más información → Ejecutar de todas formas**.
            - Atajos: **F11** pantalla completa, **F12** herramientas de desarrollo.
